<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>THE FIRST CHAPTER｜工務所大搜查</title><style>
*{box-sizing:border-box}body{margin:0;background:#262e37;color:#283947;font-family:system-ui,"Noto Sans TC",sans-serif}button{font:inherit;cursor:pointer}#game{width:min(100%,470px);height:100dvh;min-height:550px;margin:auto;position:relative;overflow:hidden;background:#d6e0df;touch-action:pan-y}.world{position:absolute;inset:0;background:linear-gradient(#bdd8e2 0 36%,#f4e6d2 36% 72%,#c9b39d 72%);transition:background .6s}.window{position:absolute;top:13%;left:9%;width:31%;height:25%;border:9px solid #e9e1cf;background:linear-gradient(#9bc3d3 50%,#d6e4db 50%);box-shadow:4px 5px 0 #0001}.window:after{content:"🏗️";font-size:54px;position:absolute;bottom:-12px;left:10px;opacity:.65}.board{position:absolute;right:8%;top:16%;width:42%;height:23%;background:#bb9b78;border:10px solid #886c54;transform:rotate(2deg);box-shadow:4px 6px 0 #0002}.board:after{content:"📌   📋";font-size:30px;position:absolute;top:25%;left:8%}.shelf{position:absolute;left:0;top:40%;height:31%;width:35%;background:linear-gradient(90deg,#b49a82,#d4b59a);border:8px solid #91745e;box-shadow:4px 5px 0 #0002}.shelf:after{content:"📚  🗂️";position:absolute;top:30%;font-size:30px}.desk{position:absolute;bottom:14%;left:-14%;width:128%;height:28%;background:linear-gradient(#dfc5a3 0 16%,#b28b6d 17% 25%,#d4b193 26%);transform:perspective(350px) rotateX(14deg);border-radius:30px 30px 0 0;box-shadow:0 -5px 30px #7258422a}.thing{position:absolute;border:0;background:#fffbf0b8;border-radius:14px;padding:10px;box-shadow:0 5px 0 #5e4a322b;font-size:35px;transition:transform .2s;z-index:3}.thing:active{transform:scale(.9)}.thing:focus-visible{outline:3px solid #bb704a}.thing small{display:block;font-size:11px;font-weight:700;color:#665849}.top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 13px) 16px 14px;background:linear-gradient(#243949c7,transparent);color:white;display:flex;justify-content:space-between;font-size:12px;letter-spacing:1px;z-index:6}.nav{position:absolute;top:48%;z-index:5;border:0;background:#fff9;border-radius:50%;height:45px;width:45px;font-size:24px;color:#4b5c64}.left{left:7px}.right{right:7px}.caption{position:absolute;top:11%;left:20px;right:20px;text-align:center;color:#384955;font-size:12px;letter-spacing:3px;font-weight:800;pointer-events:none}.dialog{position:absolute;bottom:0;left:0;right:0;background:#fffbf2f5;padding:16px 20px calc(env(safe-area-inset-bottom) + 18px);border-radius:24px 24px 0 0;z-index:8;box-shadow:0 -6px 25px #263a4235;min-height:160px}.speaker{font-weight:900;color:#aa674a;font-size:13px;margin-bottom:7px}.dialog p{line-height:1.65;font-size:15px;margin:0 0 12px;white-space:pre-line}.action{background:#bc7957;color:white;border:0;border-radius:13px;padding:12px 16px;width:100%;font-weight:800}.hint{position:absolute;bottom:185px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#243949c9;color:#fff;padding:8px 13px;border-radius:30px;font-size:12px;z-index:7}.npc{position:absolute;right:2%;bottom:30%;font-size:105px;z-index:4;filter:drop-shadow(2px 8px 4px #0003);animation:enter .6s ease both}@keyframes enter{from{transform:translateX(130px);opacity:0}to{transform:translateX(0);opacity:1}}.overlay{position:absolute;inset:0;background:#263c4ac9;display:grid;place-items:center;z-index:12;padding:25px}.paper{background:#fff8e9;padding:27px 22px;border-radius:17px;width:100%;max-width:350px;text-align:center;box-shadow:0 12px 40px #0003}.paper h1{font-family:Georgia,serif;font-size:31px;line-height:1.08;margin:12px 0}.paper p{line-height:1.7;font-size:14px}.close{position:absolute;right:20px;top:20px;background:white;border:0;border-radius:50%;width:37px;height:37px;font-size:22px}.card{display:inline-block;background:#e9e0cf;border-radius:10px;padding:13px;margin:6px;font-size:14px}.badge{position:absolute;top:70px;right:14px;background:#fff9;padding:8px 11px;border-radius:30px;font-size:12px;z-index:5}.confetti{font-size:70px;margin:10px}.end{position:absolute;inset:0;background:linear-gradient(#b3d6db,#f9e0b5);display:grid;place-items:center;z-index:20;padding:20px}.hidden{display:none!important}
</style></head><body><main id="game"><div class="world"><div class="window"></div><div class="board"></div><div class="shelf"></div><div class="desk"></div></div><div class="top"><span>THE FIRST CHAPTER</span><span>08:15 · 工務所</span></div><div class="caption" id="location">◀ 左右切換探索視角 ▶</div><div class="badge" id="badge">線索 0 / 3</div><div id="items"></div><button class="nav left" onclick="move(-1)" aria-label="向左探索">‹</button><button class="nav right" onclick="move(1)" aria-label="向右探索">›</button><div class="npc" id="npc">👷🏻‍♂️</div><div class="hint" id="hint">點擊場景裡的物件尋找線索</div><section class="dialog" id="dialog"><div class="speaker" id="speaker">阿凱學長</div><p id="line">「新人！你來得正好！開會前幫我找一下最新版圖面！」</p><button class="action" id="action" onclick="advance()">開始搜查 →</button></section><div class="overlay" id="intro"><div class="paper"><div style="font-size:55px">📐</div><small>FIRST PERSON · POINT & CLICK</small><h1>THE FIRST<br>CHAPTER</h1><p>第一天就接到緊急任務！<br>在工務所裡找出真正的最新版圖面。<br>點物件、查線索、左右探索。</p><button class="action" onclick="document.getElementById('intro').classList.add('hidden')">進入工務所 →</button></div></div><div class="overlay hidden" id="popup"><button class="close" onclick="closePopup()">×</button><div class="paper"><div id="popicon" style="font-size:58px"></div><h2 id="poptitle"></h2><p id="poptext"></p><button class="action" onclick="closePopup()">繼續探索 →</button></div></div><div class="end hidden" id="end"><div class="paper"><div class="confetti">🎉</div><small>MISSION 01 COMPLETE</small><h1>找到啦！</h1><p>「太神啦新人！你真的找到了！」<br>工務所大搜查完成。</p><p id="endingnote"></p><button class="action" onclick="restart()">再玩第一關 ↻</button><p style="font-size:12px;color:#85776c">第二關：現場不對勁！即將接續製作</p></div></div></main><script>
let view=1,started=false,found=new Set(),triedOld=false,completed=false;const names=["資料櫃","辦公桌","公告板"],itemSets=[[{id:"cabinet",icon:"🗄️",label:"抽屜",x:16,y:47},{id:"files",icon:"📁",label:"資料夾",x:54,y:48},{id:"plant",icon:"🪴",label:"盆栽",x:35,y:27}],[{id:"blueprint",icon:"📐",label:"桌上圖面",x:20,y:51},{id:"computer",icon:"💻",label:"電腦",x:54,y:45},{id:"cup",icon:"☕",label:"咖啡",x:72,y:65}],[{id:"board",icon:"📋",label:"公告板",x:44,y:27},{id:"calendar",icon:"🗓️",label:"日期表",x:15,y:49},{id:"helmet",icon:"🪖",label:"安全帽",x:69,y:55}]];
const messages={cabinet:["抽屜","一張便條紙：『最新版已經重新歸檔，別再拿錯！』","🗄️"],files:["資料夾","這裡有施工圖說目錄，但沒有最新的那份。","📁"],plant:["盆栽","盆栽底下只有一張學長的午餐折價券。","🪴"],blueprint:["桌上圖面","找到圖面了！……等等，日期竟然是去年！學長：「這張是我去年的啦！」","📐"],computer:["電腦","檔案紀錄顯示：新版圖面昨天已列印，存放在標示『本週會議』的資料夾。","💻"],cup:["咖啡","學長：「那杯是我的！拜託別把圖面泡進去！」","☕"],board:["公告板","看到了！公告上寫著：『新版圖面已更新，請確認版本 B。』","📋"],calendar:["日期表","今天的會議時間是 09:00。看來真的得快一點！","🗓️"],helmet:["安全帽","安全帽放得整整齊齊，沒有圖面。","🪖"]};
const clueIds=["cabinet","computer","board"];const $=x=>document.getElementById(x);
function render(){const items=$("items");items.innerHTML="";$("location").textContent="◀ "+names[view]+" ▶";$("badge").textContent="線索 "+found.size+" / 3";for(const a of itemSets[view]){const b=document.createElement("button");b.className="thing";b.style.left=a.x+"%";b.style.top=a.y+"%";b.innerHTML=a.icon+"<small>"+a.label+"</small>";b.onclick=()=>inspect(a.id);items.append(b)}$("npc").style.display=view===1?"block":"none"}
function move(d){view=(view+d+3)%3;render()}
function inspect(id){if(!started){$("line").textContent="「先按下開始搜查吧！我在這裡等你！」";return}if(completed)return;const m=messages[id];$("popicon").textContent=m[2];$("poptitle").textContent=m[0];$("poptext").textContent=m[1];$("popup").classList.remove("hidden");if(clueIds.includes(id))found.add(id);if(id==="blueprint")triedOld=true;render()}
function closePopup(){$("popup").classList.add("hidden");if(found.size===3){$("speaker").textContent="阿凱學長";$("line").textContent="「抽屜便條、電腦紀錄、公告板都對上了！新版 B 圖面應該就在『本週會議』資料夾！」";$("action").textContent="打開資料夾 →";$("action").onclick=finish;$("hint").textContent="三條線索已集齊！"}}
function advance(){started=true;$("speaker").textContent="阿澄（心想）";$("line").textContent="「先從哪裡找起呢……？」";$("action").textContent="左右切換視角，點擊物件";$("action").disabled=true;$("action").style.opacity=".55";$("hint").textContent="尋找抽屜、電腦與公告板的線索"}
function finish(){completed=true;$("end").classList.remove("hidden");$("endingnote").textContent=triedOld?"你還意外發現了一張去年的圖面，學長表示非常尷尬。":"你仔細串起三條線索，成功完成第一個任務！"}
function restart(){view=1;started=false;found=new Set();triedOld=false;completed=false;$("end").classList.add("hidden");$("speaker").textContent="阿凱學長";$("line").textContent="「新人！你來得正好！開會前幫我找一下最新版圖面！」";$("action").textContent="開始搜查 →";$("action").onclick=advance;$("action").disabled=false;$("action").style.opacity="1";$("hint").textContent="點擊場景裡的物件尋找線索";render()}
render();
</script></body></html>
