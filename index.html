<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>THE FIRST CHAPTER｜工地冒險日誌</title><style>
:root{font-family:"Noto Sans TC",system-ui,sans-serif;color:#35414b}*{box-sizing:border-box}body{margin:0;background:#e7e4dd}button{font:inherit;cursor:pointer}#game{max-width:480px;height:100dvh;min-height:580px;margin:auto;position:relative;overflow:hidden;background:#f4eee3}.scene{position:absolute;inset:0;background:linear-gradient(170deg,#c7dbe6 0%,#f9e7c9 55%,#d9b69c);transition:.4s}.scene:before{content:"";position:absolute;inset:22% 0 22%;opacity:.38;background:repeating-linear-gradient(90deg,transparent 0 55px,#778a8b 56px 59px,transparent 60px 105px),linear-gradient(0deg,#a9a69a 0 8%,transparent 8%)}.crane{position:absolute;right:-12%;top:17%;font-size:150px;opacity:.32;transform:rotate(-8deg)}.sun{position:absolute;width:180px;height:180px;border-radius:50%;background:#fff4cf;right:-50px;top:20%;filter:blur(8px);opacity:.6}.top{position:absolute;top:0;left:0;right:0;padding:calc(18px + env(safe-area-inset-top)) 22px 12px;display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2px;font-weight:700}.progress{position:absolute;top:77px;left:22px;right:22px;height:4px;background:#ffffff9c;border-radius:5px}.progress>div{height:100%;background:#c87e5e;transition:.3s;border-radius:5px}.character{position:absolute;bottom:34%;left:50%;transform:translateX(-50%);width:235px;height:290px;display:grid;place-items:center;font-size:145px;filter:drop-shadow(0 14px 10px #66574435)}.character small{position:absolute;bottom:10px;font-size:13px;background:#fff9;border-radius:20px;padding:5px 15px}.panel{position:absolute;bottom:0;left:0;right:0;padding:22px 22px calc(25px + env(safe-area-inset-bottom));background:#fffaf0f5;border-radius:27px 27px 0 0;box-shadow:0 -10px 40px #574a3c22;min-height:38%;max-height:61%;overflow:auto}.eyebrow{font-size:11px;letter-spacing:2px;color:#b56e4c;font-weight:800}.panel h1{font-family:Georgia,serif;font-size:36px;line-height:1.08;margin:12px 0}.panel h2{font-size:23px;margin:8px 0 12px}.panel p{font-size:15px;line-height:1.7;margin:8px 0 16px}.options{display:grid;gap:9px}.choice,.primary,.ghost{width:100%;border:1px solid #d9d0c1;border-radius:12px;background:#fff;padding:13px 14px;text-align:left;color:#35414b}.choice:active{transform:scale(.99)}.primary{background:#bd7453;color:white;border:0;text-align:center;font-weight:700}.ghost{text-align:center;background:transparent}.task{background:#f1e8d7;padding:12px;border-radius:12px;margin:10px 0;font-size:14px}.objects{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}.object{border:1px dashed #b88e74;background:#fff9;padding:10px;border-radius:10px}.object.selected{background:#d8e9db;border:2px solid #729b7b}.hint{font-size:12px;color:#8b7a69}.ending{font-size:65px;text-align:center;margin:8px}.tag{display:inline-block;background:#e9d9c4;padding:6px 10px;border-radius:99px;font-size:12px}.spark{position:absolute;top:22%;left:10%;font-size:24px;opacity:.6}@media(max-height:690px){.character{bottom:43%;height:180px;font-size:105px}.panel{max-height:67%}.panel p{line-height:1.45;margin:5px 0 9px}}
</style></head><body><main id="game"><div class="scene" id="scene"><div class="sun"></div><div class="crane">🏗</div><div class="spark">✦</div></div><div class="top"><span>豐譽營造 · C&C</span><span id="clock">DAY 01</span></div><div class="progress"><div id="bar" style="width:0%"></div></div><div class="character" id="character">👷🏻‍♂️<small>新人・阿澄</small></div><section class="panel" id="panel"></section></main><script>
const profiles={pioneer:{name:"開拓者",en:"THE PIONEER",icon:"🧭",desc:"未知不是阻礙，而是你想踏出的下一步。",traits:"主動・勇氣・探索"},analyst:{name:"解謎者",en:"THE ANALYST",icon:"🔎",desc:"你總能從不起眼的線索，找到問題的關鍵。",traits:"觀察・邏輯・求知"},connector:{name:"連結者",en:"THE CONNECTOR",icon:"🤝",desc:"你的力量，是讓不同的人願意一起向前。",traits:"溝通・理解・協作"},guardian:{name:"守護者",en:"THE GUARDIAN",icon:"🛡️",desc:"你看見別人容易忽略的細節，讓團隊走得更穩。",traits:"細心・責任・可靠"},visionary:{name:"築夢者",en:"THE VISIONARY",icon:"✨",desc:"你能在既有的框架裡，想像更好的可能。",traits:"創意・遠見・改善"},builder:{name:"實踐者",en:"THE BUILDER",icon:"🧰",desc:"你擅長把想法變成一步步看得見的成果。",traits:"行動・效率・落實"}};
const stages=[
{time:"08:00",title:"01｜消失的報到地點",npc:"警衛大哥",face:"👮🏻‍♂️",dialog:"「少年，你是不是迷路了？」\n阿澄：「……我只是還在確認方向！」",task:"找出報到線索",items:["📋 入口告示","📱 報到通知","🏠 警衛室"],question:"你會先怎麼做？",choices:[["直接詢問警衛大哥","connector"],["比對通知和現場標示","analyst"],["先聯絡報到窗口","guardian"]]},
{time:"09:20",title:"02｜圖面上的秘密",npc:"小晴學姊",face:"👩🏻‍💼",dialog:"「你看，現場跟圖面好像不一樣。」\n阿澄：「咦？真的耶！」",task:"點選一個要確認的線索",items:["📐 最新圖面","🏢 現場柱位","🗒️ 施工紀錄"],question:"發現差異後，你會先？",choices:[["追查圖說與版本","analyst"],["找現場負責人一起釐清","connector"],["整理差異並提出改善想法","visionary"]]},
{time:"10:40",title:"03｜現場危機",npc:"阿哲前輩",face:"👷🏼",dialog:"「等一下！通道被材料擋住了。」\n阿澄：「這樣可能會有危險！」",task:"找出需要處理的安全疑慮",items:["🚧 被擋住的通道","🪖 安全帽","📦 材料箱"],correct:0,question:"確認風險並請人員避開後，你想怎麼協助？",choices:[["立即協助通報並追蹤排除","guardian"],["了解為何反覆發生","analyst"],["想一套更清楚的提醒方式","visionary"]]},
{time:"14:30",title:"04｜突發任務",npc:"阿凱學長",face:"👷🏽‍♂️",dialog:"「糟了！會議快開始，資料還沒整理！」\n阿澄：「第一天就這麼刺激嗎？」",task:"選擇要優先確認的任務",items:["⏰ 會議時間","📁 必備資料","💬 同事分工"],question:"你會用哪種方式推進？",choices:[["先抓重點，馬上動手整理","builder"],["找夥伴協調分工","connector"],["重新規劃更有效率的流程","visionary"]]},
{time:"17:30",title:"05｜最後的選擇",npc:"阿凱學長",face:"👷🏽‍♂️",dialog:"「新人！第一天還好嗎？明天見啦！」\n阿澄看著夕陽下的工地，笑了。",task:null,question:"明天，你最期待什麼？",choices:[["挑戰自己還沒做過的事","pioneer"],["搞懂更多工程裡的秘密","analyst"],["和大家一起完成一件事","connector"],["把今天學到的真正做出來","builder"]]}];
let step=-1,selected=-1,answers=[],done=false;const panel=document.querySelector("#panel"),character=document.querySelector("#character");
function render(){document.querySelector("#bar").style.width=(step<0?0:step>=5?100:(step/5)*100)+"%";if(step<0){character.innerHTML="👷🏻‍♂️<small>新人・阿澄</small>";panel.innerHTML='<div class="eyebrow">INTERACTIVE ADVENTURE · 約 3 分鐘</div><h1>THE FIRST<br>CHAPTER</h1><p>第一天，你會成為怎樣的工程師？</p><p>「歡迎來到工地！完成今天的冒險，解鎖你的工程師人格徽章。」</p><button class="primary" onclick="next()">開始冒險 →</button>';return}
if(step===5){const scores={};answers.forEach(x=>scores[x]=(scores[x]||0)+1);let order=Object.keys(profiles).sort((a,b)=>(scores[b]||0)-(scores[a]||0));const p=profiles[order[0]];character.innerHTML=p.icon+'<small>專屬工程師徽章</small>';document.querySelector("#clock").textContent="MISSION COMPLETE";panel.innerHTML='<div class="eyebrow">YOUR ENGINEER IDENTITY</div><h2>'+p.name+'</h2><span class="tag">'+p.en+'</span><p>'+p.desc+'</p><p><strong>'+p.traits+'</strong></p><p class="hint">這是一場趣味人格探索，沒有好壞與標準答案。</p><button class="primary" onclick="share()">分享我的結果</button><button class="ghost" onclick="restart()">再玩一次 ↻</button>';return}
const s=stages[step];document.querySelector("#clock").textContent=s.time;character.innerHTML=s.face+'<small>'+s.npc+'</small>';const hasTask=s.task&&!done;panel.innerHTML='<div class="eyebrow">MISSION 0'+(step+1)+' / 05</div><h2>'+s.title+'</h2><p>'+s.dialog.replace(/\n/g,"<br>")+'</p>'+(hasTask?'<div class="task">🔍 任務：'+s.task+'</div><div class="objects">'+s.items.map((x,i)=>'<button class="object" onclick="inspect('+i+')">'+x+'</button>').join("")+'</div><p class="hint">點選線索，完成探索後解鎖選擇。</p>':'<div class="task">'+s.question+'</div><div class="options">'+s.choices.map((x,i)=>'<button class="choice" onclick="choose('+i+')">'+x[0]+' →</button>').join("")+'</div>')}
function inspect(i){const s=stages[step];if(s.correct!==undefined&&i!==s.correct){document.querySelector(".hint").textContent="再看看，哪裡可能影響通行安全？";return}done=true;render()}
function choose(i){answers.push(stages[step].choices[i][1]);next()}
function next(){step++;done=false;render()}
function restart(){step=-1;answers=[];done=false;document.querySelector("#clock").textContent="DAY 01";render()}
async function share(){const counts={};answers.forEach(x=>counts[x]=(counts[x]||0)+1);const key=Object.keys(profiles).sort((a,b)=>(counts[b]||0)-(counts[a]||0))[0];const msg="我的工程師人格是「"+profiles[key].name+"」！\n"+profiles[key].desc+"\n"+location.href;try{if(navigator.share)await navigator.share({title:"THE FIRST CHAPTER",text:msg,url:location.href});else if(navigator.clipboard){await navigator.clipboard.writeText(msg);alert("已複製結果！")}else prompt("複製結果",msg)}catch(e){}}
render();
</script></body></html>
